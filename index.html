<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hệ Thống Mẫu Tài Khoản Ngân Hàng</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: Arial, sans-serif;
      display: flex;
      height: 100vh;
      background-color: #f4f6f9;
    }

    /* Thanh Menu bên trái */
    .sidebar {
      width: 260px;
      background-color: #ffffff;
      border-right: 1px solid #e0e0e0;
      padding: 20px 15px;
      overflow-y: auto;
    }

    .menu-title {
      font-size: 14px;
      font-weight: bold;
      color: #0056b3;
      text-transform: uppercase;
      margin-bottom: 12px;
      margin-top: 15px;
      padding-bottom: 5px;
      border-bottom: 2px solid #0056b3;
    }
    .menu-title:first-child {
      margin-top: 0;
    }

    /* Các nút bấm */
    .menu-item {
      display: block;
      width: 100%;
      padding: 10px 12px;
      margin-bottom: 8px;
      background-color: #f8f9fa;
      color: #333;
      text-decoration: none;
      border: 1px solid #dcdcdc;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 500;
      transition: all 0.2s ease;
    }

    .menu-item:hover {
      background-color: #e9ecef;
      border-color: #0056b3;
      color: #0056b3;
    }

    /* Khung nội dung iframe */
    .content {
      flex: 1;
      height: 100%;
    }

    iframe {
      width: 100%;
      height: 100%;
      border: none;
    }
  </style>
</head>
<body>

  <!-- SIDEBAR MENU -->
  <div class="sidebar">
    
    <!-- Nhóm Wallet -->
    <div class="menu-title">🏛️ Tài Khoản Wallet</div>
    <a href="wallet/au.html" target="contentFrame" class="menu-item"><b>AU</b> Tài khoản Úc (AU)</a>
    <a href="wallet/us.html" target="contentFrame" class="menu-item"><b>US</b> Tài khoản Mỹ (US)</a>
    <a href="wallet/ca.html" target="contentFrame" class="menu-item"><b>CA</b> Tài khoản Canada (CA)</a>

    <!-- Nhóm Wire Transfer -->
    <div class="menu-title">🌐 Chuyển Khoản Wire</div>
    <a href="wire/all" target="contentFrame" class="menu-item">Tất cả tài khoản Wire</a>
    <a href="wire/aud" target="contentFrame" class="menu-item">Wire - AUD</a>
    <a href="wire/usd" target="contentFrame" class="menu-item">Wire - USD</a>
    <a href="wire/vnd" target="contentFrame" class="menu-item">Wire - VND</a>

  </div>

  <!-- IFRAME HIỂN THỊ NỘI DUNG -->
  <div class="content">
    <iframe name="contentFrame" src="wallet/au.html"></iframe>
  </div>

</body>
</html>
