<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hệ Thống Mẫu Tài Khoản Ngân Hàng</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: Arial, sans-serif;
      display: flex;
      height: 100vh;
      background-color: #f4f6f9;
    }

    /* Thanh Menu bên trái */
    .sidebar {
      width: 260px;
      background-color: #ffffff;
      border-right: 1px solid #e0e0e0;
      padding: 20px 15px;
      overflow-y: auto;
    }

    .menu-title {
      font-size: 13px;
      font-weight: bold;
      color: #0056b3;
      text-transform: uppercase;
      margin-bottom: 10px;
      margin-top: 18px;
      padding-bottom: 4px;
      border-bottom: 2px solid #0056b3;
    }
    .menu-title:first-child {
      margin-top: 0;
    }

    /* Nút bấm menu */
    .menu-item {
      display: block;
      width: 100%;
      padding: 9px 12px;
      margin-bottom: 6px;
      background-color: #f8f9fa;
      color: #333;
      text-decoration: none;
      border: 1px solid #dcdcdc;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 500;
      transition: all 0.2s ease;
    }

    .menu-item:hover {
      background-color: #e9ecef;
      border-color: #0056b3;
      color: #0056b3;
    }

    /* Khung nội dung hiển thị bên phải */
    .content-container {
      flex: 1;
      display: flex;
      flex-direction: column;
      height: 100%;
    }

    /* Thanh công cụ phía trên Iframe */
    .top-bar {
      height: 45px;
      background-color: #ffffff;
      border-bottom: 1px solid #e0e0e0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 20px;
    }

    .top-bar span {
      font-size: 13px;
      color: #666;
    }

    .btn-open-separate {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 14px;
      background-color: #28a745;
      color: #ffffff;
      text-decoration: none;
      font-size: 12px;
      font-weight: bold;
      border-radius: 4px;
      transition: background-color 0.2s;
    }

    .btn-open-separate:hover {
      background-color: #218838;
    }

    /* Frame chứa nội dung */
    .iframe-wrapper {
      flex: 1;
      width: 100%;
      height: calc(100% - 45px);
    }

    iframe {
      width: 100%;
      height: 100%;
      border: none;
    }
  </style>
</head>
<body>

  <!-- SIDEBAR MENU -->
  <div class="sidebar">
    
    <!-- Nhóm Wallet -->
    <div class="menu-title">🏛️ Tài Khoản Wallet</div>
    <a href="wallet/au.html" onclick="updateDirectLink('wallet/au.html')" target="contentFrame" class="menu-item"><b>AU</b> Tài khoản Úc (AU)</a>
    <a href="wallet/us.html" onclick="updateDirectLink('wallet/us.html')" target="contentFrame" class="menu-item"><b>US</b> Tài khoản Mỹ (US)</a>
    <a href="wallet/ca.html" onclick="updateDirectLink('wallet/ca.html')" target="contentFrame" class="menu-item"><b>CA</b> Tài khoản Canada (CA)</a>

    <!-- Nhóm Wire Transfer -->
    <div class="menu-title">🌐 Chuyển Khoản Wire</div>
    <a href="wire/all.html" onclick="updateDirectLink('wire/all.html')" target="contentFrame" class="menu-item">Tất cả tài khoản Wire</a>
    <a href="wire/aud.html" onclick="updateDirectLink('wire/aud.html')" target="contentFrame" class="menu-item">Wire - AUD</a>
    <a href="wire/usd.html" onclick="updateDirectLink('wire/usd.html')" target="contentFrame" class="menu-item">Wire - USD</a>
    <a href="wire/vnd.html" onclick="updateDirectLink('wire/vnd.html')" target="contentFrame" class="menu-item">Wire - VND</a>

  </div>

  <!-- CONTAINER BÊN PHẢI -->
  <div class="content-container">
    
    <!-- Thanh công cụ chứa nút mở trang lẻ -->
    <div class="top-bar">
      <span>👁️ Xem trước thông tin tài khoản</span>
      <a id="directLink" href="wallet/au.html" target="_blank" class="btn-open-separate">
        ↗️ Mở trang lẻ (để In / Tải PDF)
      </a>
    </div>

    <!-- IFRAME -->
    <div class="iframe-wrapper">
      <iframe id="mainIframe" name="contentFrame" src="wallet/au.html"></iframe>
    </div>

  </div>

  <!-- SCRIPT CẬP NHẬT LINK TRANG LẺ -->
  <script>
    function updateDirectLink(url) {
      document.getElementById('directLink').href = url;
    }
  </script>

</body>
</html>
