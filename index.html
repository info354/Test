<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hệ Thống Mẫu Tài Khoản Ngân Hàng</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    body {
      display: flex;
      height: 100vh;
      background-color: #f4f6f8;
      overflow: hidden;
    }
    /* Thanh Menu bên trái */
    .sidebar {
      width: 280px;
      background: #ffffff;
      border-right: 1px solid #e1e4e8;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 15px;
      flex-shrink: 0;
    }
    .sidebar h2 {
      font-size: 16px;
      color: #0969da;
      padding-bottom: 10px;
      border-bottom: 2px solid #0969da;
    }
    .menu-item {
      display: block;
      padding: 12px 15px;
      background: #f8f9fa;
      border: 1px solid #e1e4e8;
      border-radius: 6px;
      text-decoration: none;
      color: #24292f;
      font-size: 13px;
      font-weight: 600;
      transition: all 0.2s ease;
    }
    .menu-item:hover {
      background: #ddf4ff;
      border-color: #54aeff;
      color: #0969da;
    }
    /* Khung chiếu trang con bên phải */
    .content-area {
      flex-grow: 1;
      height: 100vh;
      background: #ffffff;
    }
    iframe {
      width: 100%;
      height: 100%;
      border: none;
    }
  </style>
</head>
<body>

  <!-- Thanh Menu cố định bên trái -->
  <div class="sidebar">
    <h2>🏦 Danh Mục Ngân Hàng</h2>
    
    <!-- Lưu ý thuộc tính target="view-frame" giúp đẩy nội dung vào iframe -->
    <a href="./au.html" target="view-frame" class="menu-item">🇦🇺 Tài khoản Úc (AU)</a>
    <a href="./us.html" target="view-frame" class="menu-item">🇺🇸 Tài khoản Mỹ (US)</a>
  </div>

  <!-- Khung hiển thị nội dung các trang con bên phải -->
  <div class="content-area">
    <iframe name="view-frame" src="./au.html"></iframe>
  </div>

</body>
</html>
